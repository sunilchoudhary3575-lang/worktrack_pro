name: Build macOS Employee App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-macos:
    name: Build macOS DMG & ZIP
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Fix 7zip-bin for macOS runners
        run: |
          brew install p7zip || true
          SEVEN_ZA=""
          if [ -f "/opt/homebrew/bin/7za" ]; then
            SEVEN_ZA="/opt/homebrew/bin/7za"
          elif [ -f "/usr/local/bin/7za" ]; then
            SEVEN_ZA="/usr/local/bin/7za"
          elif command -v 7za >/dev/null 2>&1; then
            SEVEN_ZA=$(command -v 7za)
          elif [ -f "node_modules/7zip-bin/mac/x64/7za" ]; then
            SEVEN_ZA="node_modules/7zip-bin/mac/x64/7za"
          fi
          echo "Using 7za from: $SEVEN_ZA"

          for dir in node_modules/7zip-bin apps/employee-app/node_modules/7zip-bin; do
            mkdir -p "$dir/mac/arm64" "$dir/mac/x64"
            if [ -n "$SEVEN_ZA" ] && [ -f "$SEVEN_ZA" ]; then
              cp -f "$SEVEN_ZA" "$dir/mac/arm64/7za"
              cp -f "$SEVEN_ZA" "$dir/mac/x64/7za"
              chmod +x "$dir/mac/arm64/7za" "$dir/mac/x64/7za"
            fi
          done

          if [ -n "$SEVEN_ZA" ] && [ -f "$SEVEN_ZA" ]; then
            cp -f "$SEVEN_ZA" ./7za
            cp -f "$SEVEN_ZA" apps/employee-app/7za
            chmod +x ./7za apps/employee-app/7za
          fi

      - name: Build Shared Package
        run: npm run build:shared

      - name: Build Employee App DMG (arm64 & x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:employee:mac

      - name: Upload macOS Installer (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: WorkTrackPro-Employee-MacOS
          path: |
            apps/employee-app/release-mac/*.dmg
            apps/employee-app/release-mac/*.zip
          retention-days: 14
          if-no-files-found: error

